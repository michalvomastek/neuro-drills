html/head_include="<meta name=\"theme-color\" content=\"#1b1e26\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Neuro drills\">\n<script>\n// A new build ships a service worker with a new cache; the engine registers it but the new worker would wait until every tab is closed. Ask it to take over at start-up and reload once, so the next open always runs the latest version.\n(function () {\n  if (!('serviceWorker' in navigator)) { return; }\n  var reloaded = false;\n  navigator.serviceWorker.addEventListener('controllerchange', function () {\n    if (reloaded || performance.now() > 20000) { return; }\n    reloaded = true; window.location.reload();\n  });\n  function adopt(worker) {\n    if (!worker) { return; }\n    if (worker.state === 'installed' && navigator.serviceWorker.controller) { worker.postMessage('claim'); }\n    worker.addEventListener('statechange', function () {\n      if (worker.state === 'installed' && navigator.serviceWorker.controller) { worker.postMessage('claim'); }\n    });\n  }\n  var tries = 0;\n  var timer = setInterval(function () {\n    tries += 1;\n    navigator.serviceWorker.getRegistration().then(function (reg) {\n      if (!reg) { if (tries > 30) { clearInterval(timer); } return; }\n      clearInterval(timer);\n      adopt(reg.waiting); adopt(reg.installing);\n      reg.addEventListener('updatefound', function () { adopt(reg.installing); });\n      reg.update().catch(function () {});\n    }).catch(function () {});\n  }, 1000);\n})();\n</script>"
